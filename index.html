<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bisnesidea-hedelmäpeli</title>
<meta name="description" content="Arvo itsellesi bisnesidea: intohimo × toimiala × tulevaisuuden maailma.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="stage">

  <header class="masthead">
    <h1>Bisnesidea&#8209;hedelmäpeli</h1>
    <p class="tagline">Intohimo &times; Toimiala &times; Tulevaisuus</p>
  </header>

  <!-- The cabinet: three reels plus the lever on the right -->
  <section class="cabinet" aria-label="Hedelmäpeli">
    <div class="cabinet-inner">

      <div class="reels" id="reels">
        <!-- Reel template, repeated three times -->
        <article class="reel" data-reel="passion">
          <div class="reel-label">Intohimo</div>
          <div class="reel-window">
            <div class="reel-strip"></div>
            <div class="reel-glass" aria-hidden="true"></div>
            <div class="lock-flag" aria-hidden="true">Lukittu</div>
          </div>
          <button class="lock-btn" type="button" aria-pressed="false">
            <span class="lock-icon" aria-hidden="true"></span>
            <span class="lock-text">Lukitse</span>
          </button>
        </article>

        <article class="reel" data-reel="sector">
          <div class="reel-label">Toimiala</div>
          <div class="reel-window">
            <div class="reel-strip"></div>
            <div class="reel-glass" aria-hidden="true"></div>
            <div class="lock-flag" aria-hidden="true">Lukittu</div>
          </div>
          <button class="lock-btn" type="button" aria-pressed="false">
            <span class="lock-icon" aria-hidden="true"></span>
            <span class="lock-text">Lukitse</span>
          </button>
        </article>

        <article class="reel" data-reel="scenario">
          <div class="reel-label">Maailma, jossa&hellip;</div>
          <div class="reel-window">
            <div class="reel-strip"></div>
            <div class="reel-glass" aria-hidden="true"></div>
            <div class="lock-flag" aria-hidden="true">Lukittu</div>
          </div>
          <button class="lock-btn" type="button" aria-pressed="false">
            <span class="lock-icon" aria-hidden="true"></span>
            <span class="lock-text">Lukitse</span>
          </button>
        </article>
      </div>

      <!-- The lever. Click the knob (or the whole column) to spin. -->
      <div class="lever-column">
        <button class="lever" id="lever" type="button" aria-label="Vedä vivusta">
          <span class="lever-slot" aria-hidden="true"></span>
          <span class="lever-arm">
            <span class="lever-rod"></span>
            <span class="lever-knob"></span>
          </span>
        </button>
        <span class="lever-hint">Vedä!</span>
      </div>

    </div>
  </section>

  <!-- Result sentence. The box is always in the layout; .is-empty only blanks
       its contents, so nothing shifts when an idea appears or is cleared. -->
  <section class="result is-empty" id="result">
    <p class="result-sentence"><span id="resultSentence">Vedä vivusta ja katso, millainen idea syntyy.</span></p>
    <div class="result-actions">
      <button class="ghost-btn" id="copyBtn" type="button">Kopioi idea</button>
      <button class="ghost-btn" id="spinAgainBtn" type="button">Pyöräytä uudelleen</button>
    </div>
  </section>

  <footer class="footnote">
    <span><kbd>Välilyönti</kbd> pyöräyttää &middot; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> lukitsevat kiekot</span>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" title="Äänet">
      <span id="soundIcon">🔊</span><span class="sound-text">Äänet</span>
    </button>
  </footer>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
